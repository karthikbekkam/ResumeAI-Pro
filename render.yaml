services:
  - type: web
    name: resumeai-pro
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resumeai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: resumeai-db
    plan: free
    databaseName: resumeai_db
    user: resumeai_user
